name: Windows
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
          rustup override set 1.99.1
      - name: Format, test and build (no registration or volume access)
        shell: pwsh
        run: |
          if ('${{ matrix.target }}' -eq 'x86_64-pc-windows-gnu') {
            $env:PATH = "C:\mingw64\bin;$env:PATH"
          }
          .\scripts\Build.ps1 -Target '${{ matrix.target }}'
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Exercise release packaging without installation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $metadata = cargo metadata --locked --offline --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'usnjmon').version
          .\scripts\Test-Packaging.ps1 -ExpectedVersion $version -OutputDirectory (Join-Path $env:RUNNER_TEMP 'package-test')
